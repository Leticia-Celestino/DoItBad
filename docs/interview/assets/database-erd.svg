    <style>.t{font:700 34px 'DejaVu Sans';fill:#3D392F}.st{font:400 17px 'DejaVu Sans';fill:#70675b}.b{fill:#FBF6EC;stroke:#CFC2AD;stroke-width:2}.h{fill:#5C6B4A}.ht{font:700 19px 'DejaVu Sans';fill:#fff}.x{font:400 15px 'DejaVu Sans';fill:#3D392F}.k{font:700 15px 'DejaVu Sans';fill:#C06F4C}.l{stroke:#5C6B4A;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="980" fill="#F4EDE1"/><text x="60" y="58" class="t">Modelo de dados — Supabase/PostgreSQL</text>
  <text x="60" y="88" class="st">Entidades relacionais para identidade e auditoria; payload JSONB validado para o workspace polimórfico</text>

  <g transform="translate(70 145)"><rect width="260" height="180" rx="18" class="b"/><path d="M18 0h224a18 18 0 0118 18v42H0V18A18 18 0 0118 0" class="h"/><text x="22" y="38" class="ht">auth.users</text><text x="22" y="88" class="k">PK id uuid</text><text x="22" y="118" class="x">email · metadata · sessão</text><text x="22" y="148" class="x">gerenciado pelo Supabase Auth</text></g>
  <g transform="translate(430 120)"><rect width="280" height="220" rx="18" class="b"/><path d="M18 0h244a18 18 0 0118 18v42H0V18A18 18 0 0118 0" class="h"/><text x="22" y="38" class="ht">profiles</text><text x="22" y="88" class="k">PK/FK id → auth.users</text><text x="22" y="118" class="x">display_name · locale</text><text x="22" y="148" class="x">created_at · updated_at</text><text x="22" y="185" class="x">RLS: somente o próprio usuário</text></g>
  <g transform="translate(430 400)"><rect width="280" height="245" rx="18" class="b"/><path d="M18 0h244a18 18 0 0118 18v42H0V18A18 18 0 0118 0" class="h"/><text x="22" y="38" class="ht">intentions</text><text x="22" y="88" class="k">PK id uuid</text><text x="22" y="118" class="k">FK owner_id → auth.users</text><text x="22" y="148" class="x">title · status</text><text x="22" y="178" class="x">created_at · updated_at</text><text x="22" y="215" class="x">RLS CRUD por proprietário</text></g>
  <g transform="translate(785 120)"><rect width="330" height="320" rx="18" class="b"/><path d="M18 0h294a18 18 0 0118 18v42H0V18A18 18 0 0118 0" class="h"/><text x="22" y="38" class="ht">workspace_items</text><text x="22" y="88" class="k">PK id uuid</text><text x="22" y="118" class="k">FK user_id → auth.users</text><text x="22" y="148" class="x">kind: task | focus | mood | project</text><text x="22" y="178" class="x">payload jsonb + CHECK por kind</text><text x="22" y="208" class="x">revision integer · created_at</text><text x="22" y="245" class="x">índice (user_id, kind, created_at)</text><text x="22" y="275" class="x">1 foco ativo por usuário</text><text x="22" y="302" class="x">RLS CRUD + concorrência otimista</text></g>
  <g transform="translate(785 535)"><rect width="330" height="300" rx="18" class="b"/><path d="M18 0h294a18 18 0 0118 18v42H0V18A18 18 0 0118 0" class="h"/><text x="22" y="38" class="ht">ai_recommendations</text><text x="22" y="88" class="k">PK id uuid</text><text x="22" y="118" class="k">FK user_id → auth.users</text><text x="22" y="148" class="k">FK task_id → workspace_items</text><text x="22" y="178" class="x">task_revision · microaction · reason</text><text x="22" y="208" class="x">estimated_minutes · source · model</text><text x="22" y="238" class="x">status · created_at · accepted_at</text><text x="22" y="270" class="x">RLS e vínculo obrigatório com tarefa própria</text></g>
  <g transform="translate(70 520)"><rect width="290" height="315" rx="18" class="b"/><path d="M18 0h254a18 18 0 0118 18v42H0V18A18 18 0 0118 0" fill="#C87E5A"/><text x="22" y="38" class="ht">waitlist_signups</text><text x="22" y="88" class="k">PK id uuid</text><text x="22" y="118" class="x">name · email único · locale</text><text x="22" y="148" class="x">status: pending/confirmed/unsubscribed</text><text x="22" y="178" class="x">hashes de confirmação/descadastro</text><text x="22" y="208" class="x">reservas e timestamps</text><text x="22" y="245" class="x">sem acesso anon/authenticated</text><text x="22" y="275" class="x">somente RPCs com service_role</text></g>
  <g transform="translate(70 870)"><rect width="1045" height="70" rx="18" fill="#303644"/><text x="24" y="29" class="ht">waitlist_rate_limits</text><text x="280" y="29" class="x" fill="#fff">PK hash HMAC do IP · janela · tentativas</text><text x="24" y="54" class="x" fill="#fff">Limite atômico: 5 tentativas / 15 min; nenhum IP puro é persistido.</text></g>

